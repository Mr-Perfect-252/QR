# Project-wide Gradle settings.

# AndroidX is required (the ApexHub SDK and all androidx.* dependencies use it).
# Without this the build fails at :app:mapReleaseSourceSetPaths / resource merging.
android.useAndroidX=true
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official

# JVM args for the Gradle daemon — enough heap for AGP resource processing.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable configuration caching / parallel builds for faster CI.
org.gradle.caching=true
org.gradle.parallel=true

# Only keep the resource configurations the app needs.
android.nonTransitiveRClass=true
