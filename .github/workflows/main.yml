name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        env:
          # ApexHub SDK config is injected at build time. In real deployments set
          # these as repository/organization Actions secrets. The defaults in
          # app/build.gradle.kts keep the build green even when they are unset.
          APEXHUB_PUBLIC_KEY: ${{ secrets.APEXHUB_PUBLIC_KEY }}
          APEXHUB_APP_ID: ${{ secrets.APEXHUB_APP_ID }}
          APEXHUB_CHANNEL: ${{ secrets.APEXHUB_CHANNEL }}
          APEXHUB_CHECK_INTERVAL_HOURS: ${{ secrets.APEXHUB_CHECK_INTERVAL_HOURS }}
          APEXHUB_DEBUG: ${{ secrets.APEXHUB_DEBUG }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lattice-qr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
